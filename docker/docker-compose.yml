services:
  # FastAPI application


  # Nginx


  # Mongo DB
  mongodb:
    
    image: mongo:7.0-jammy
    
    container_name: mongodb
    
    ports:
      - target: 27017
        published: 27007
    
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - type: volume
        source: mongodb_data
        target: /data/db
    
    networks:
      - backend
    
    restart: always


  # Qdrant 


  # Prometheus Monitoring


  # Grafana Dashboard

  
  # Node exporter for performance metrics 


  #Mongo DB exporter for metrics


networks:
  backend:

volumes:
  mongodb_data:
