services:
  # FastAPI application
  fastapi:
    build:
      context: ..
      dockerfile: docker/minirag/Dockerfile
    container_name: fastapi

    ports:
      - target: 8000
        published: 8000
    
    networks:
      - backend
    
    restart: always

    depends_on:
      mongodb:
        condition: service_healthy
    
    volumes:
      - type: volume
        source: fastapi_data
        target: /app/assets

    
    env_file:
      - ./env/.env.app
  
  # Nginx
  nginx:
    image: nginx:stable-alpine3.20-perl
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastapi
    networks:
      - backend
    restart: always
  
  
  # Mongo DB
  mongodb:
    image: mongo:7.0-jammy
    
    container_name: mongodb
    
    ports:
      - target: 27017
        published: 27017
    
    env_file:
      - ./env/.env.mongodb

    volumes:
      - type: volume
        source: mongodb_data
        target: /data/db
    
    networks:
      - backend
    
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "mongosh mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # Qdrant 
  qdrant:
    image: qdrant/qdrant:v1.14.1

    container_name: qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    networks:
      - backend
    
    restart: always

    volumes:
      - type: volume
        source: qdrant_data
        target: /qdrant/storage
    
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
  
  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:main

    container_name: prometheus

    ports:
      - target: 9090
        published: 9090
    
    networks:
      - backend
    
    restart: always

    volumes:
      - type: volume
        source: prometheus_data
        target: /prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'


  # Grafana Dashboard
  grafana:
    image: grafana/grafana:12.0.2-ubuntu

    container_name: grafana

    ports:
      - target: 3000
        published: 3000
    
    volumes:
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
    networks:
      - backend
    
    restart: always

    env_file:
      - ./env/.env.grafana

    depends_on:
      - prometheus

  # Node exporter for performance metrics 
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - backend
    restart: always
  #Mongo DB exporter for metrics
  mongodb-exporter:
    image: percona/mongodb_exporter:0.44.0
    
    container_name: mongodb-exporter
    
    ports:
      - target: 9216
        published: 9216
    
    env_file:
      - ./env/.env.mongodb.exporter
    
    depends_on:
      - mongodb
    
    networks:
      - backend
    
    restart: always

    



networks:
  backend:
    driver: bridge

volumes:
  mongodb_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  fastapi_data:

configs:
  qdrant_config:
    content: |
      log_level: INFO